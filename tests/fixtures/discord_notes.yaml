- id: wiki-ac-calc-off-balorg-of-moria-example
  notes: '<div><div><div><a href="https://homerslotr.com/creatures/azagoth001" target="_blank" rel="noopener">The balrog of moria</a></div></div><div><div></div></div></div><div><div> <div><span>Wiki says 84ac but log was reporting misses on rolls of 90+ </span><span><img src="https://discord.com/assets/5134d215343b97ef.svg" alt="😅"></span></div></div><div><div></div></div></div><div><div> <div><span>Eventually killed him anyways but it took a loooooooong time, thanks to monk apr xD</span></div></div><div><div></div></div></div><div><div> <div><br></div><div><br></div><div>

    <div><div><div><span>DM Notes:</span></div><div><span>Wiki is def. wrong</span></div></div><div><div><div><div><div><div><div><a href="https://cdn.discordapp.com/attachments/514343293761486850/1542345205435338803/image.png?ex=0&is=0&hm=0&"></a><div><div><img src="https://media.discordapp.net/attachments/514343293761486850/1542345205435338803/image.png?ex=0&is=0&hm=0&" alt="Image"><img alt=""></div><div>FIrst, his attack damage is off in his character sheet -- it''s not reflecting <a href="https://homerslotr.com/items/it_crewpsp022" target="_blank" rel="noopener">Balrogs Battle Claw</a>, which I can see equipped as a creature weapon when I examine the blueprint in the nwn toolset.</div><div><br></div></div></div><div><div></div><div></div></div><div></div></div></div></div></div></div></div><div><div></div></div></div><div><div> <div><span>Second, Balrog is wearing a shield I was not expecting (Shield of The Fleet Elf), and when I take it off him he goes back to 84 AC like wiki says,</span> <span><span></span></span></div></div><div><div><div><div><div><div><div><a href="https://cdn.discordapp.com/attachments/514343293761486850/1542346117016981544/image.png?ex=0&is=0&hm=0&"></a><div><div><img src="https://media.discordapp.net/attachments/514343293761486850/1542346117016981544/image.png?ex=0&is=0&hm=0&" alt="Image"><img alt=""></div></div></div><div><div></div><div></div></div><div></div></div></div></div></div></div></div><div><div></div></div></div><div><div> <div><span>he also is not using the whip he''s supposed to be using.. he missing a feat for it (exotic weapon proficency)</span></div></div><div><div><div><div><div><div><div><a href="https://cdn.discordapp.com/attachments/514343293761486850/1542346672120668253/image.png?ex=0&is=0&hm=0&"></a><div><div><img src="https://media.discordapp.net/attachments/514343293761486850/1542346672120668253/image.png?ex=0&is=0&hm=0&" alt="Image"></div><div><br></div><div>For Balrog specifically, I think I want to to a deeper compare to the 2009 fork version which seems to make this creature 2x harder, <br>(2009  →Baseline)<b>cr</b>: 1285 → 555<b>feat_count</b>: 65 → 48<b>hp</b>: 10002 → 8100<b>natural_ac</b>: 56 → 40Does the 2009 version use weapons or creature claws? Is the loot any different/more powerful?</div><div><br></div><div>For creatures in general, I want a build gate that:</div><div><ul><li> looks for items they start with equipped but game engine forces them to unequip immoderately because they lack the required feat (not a factor in the balrog example but I''ve seen this happen with other creatuers)</li><li>Looks for items in creature''s inventory that typical creature AI will have them equip, but in the resting blueprint that item is not equipped (IS the case with our shield of the fleet elf in the balrog example)</li></ul><div>Both cases cause the wiki generation to show inaccurate data.</div></div></div></div></div></div></div></div></div></div></div>


    <br></div></div></div>'
