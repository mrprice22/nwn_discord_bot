- id: generally
  notes: "<div><span><span>Balendin: </span></span><span>Some changes to classes to make them somewhat more viable? As it stands i don't really see much use for classes like black guard (after 4 levels or so) assassin, paladin, cot, and more im sure im missing </span><span><img src=\"https://discord.com/assets/744deec4104c34a5.svg\" alt=\"\U0001F606\"></span> </div><div><br></div><div>E.g.</div><div><a href=\"#idea-make-black-guards-more-usefull\">Make Black Guards more Usefull</a></div><div><a href=\"#idea-make-chamption-of-torm-more-usefull\">Make Chamption of Torm more usefull</a></div><div><br></div><div><span>Paladin is somewhat lesser useful here though due to high magic, so buffs aren't as good. Obviously still gets DM and saves but I doubt I'd ever bother going over 4 levels, same applies for bg on that. \n\nAssassins are just worse rogues really.</span></div>"
- id: kerfualls-disappearing-act
  notes: <div><div><span><span>Balendin: </span></span><span>As for Kerufall I never killed him just got him to use his 5 heals or such and then I died. Ran back and he was gone </span><span><img src="https://discord.com/assets/9999d977e14a0d5a.svg" alt="🙁"></span></div></div><div><br></div><div><br></div><div><div><span><span>HomelessSon</span><span><span> :</span></span></span><span>What I was expecting was if it took you less than 15 min to get back to where he was, he would still be there, but if it took longer; even though he didnt die, he would have reverted back to his original spawn point.</span></div></div><div><div><div><span>did the creature give a shout or just was gone without a word?</span></div></div></div><div><br></div><div><br></div><div><div><span><span>Balendin: </span></span><span>Pretty sure just vanished. Not 100% sure I went back instantly and the run theres a nightmare too so</span></div></div><span>I was fighting him for ages as my damage was kinda ehsss</span>
- id: persistant-map-exploration
  notes: <div><div><span><span>Sync</span></span><span><span><i> — </i>7:51 AM</span></span><div><span>Its kind of annoying to lose map clearance all the time so... What about rewarding exploration?</span></div></div><div><div></div></div></div><div><div> <div><span>Saw it in another server so i know it's possible, there was an item that you needed to buy and when you uncovered 80% of each map, you use that item and have that character save the cleared map permanently</span></div></div></div><div><div> <div><span>And give an xp reward according to lvl/cr of the area</span></div></div><div><div></div></div></div><div><div> <div><span>(or just well..... Have all the maps uncovered already by default </span><span><img src="https://discord.com/assets/e5bddb2a9171637d.svg" alt="🤣"></span><span>)</span></div><div><span><br></span></div></div><div><div></div></div></div><div><div><span><span>HomelessSon</span><span><span> [MW], </span></span></span><span><span><i> — </i>11:12 AM</span></span><div><span>That's a fun idea</span></div></div></div>Could also give stats in hall of fame for player with most areas/maps explored
