- id: level-drain-property-not-removable-from-forge
  notes: <div>Related to work done by ideas <a href="#idea-smith-can-disenchant-negative-abilities">smith can disenchant negative abilities</a> and <a href="#idea-smith-can-disenchant-negative-abilities-exclude-negative-arcance-spell-failure">negative arcance spell failure (reduced spell failure) might count as negetive property on items for smithing, but it's a positive (good) thing to have</a></div><div>It seems like 'level drain' on weapons might be counting as a negative property. Investigate, and document in customizations doc what properties smith counts and positive (boon) vs negative (penalty that can't be removed). The ability to drain levels on your opponent when you hit them is a boon.</div><div><br></div><ul><li><div><div><span><span>Sync</span></span><span><span><i>:</i></span></span><span> Oh i tried to remove the lvl drain from the </span><span>katana of dol guldur,</span><span> but doesnt let me. Guess its either cos its millions over the cap or has more than 7 properties </span><span><img src="https://discord.com/assets/5134d215343b97ef.svg" alt="😅"></span></div></div></li></ul><ul><li><div><div><span><span>HomelessSon</span><span><span>: </span></span></span><span>huh, i wonder if the 'drain' keyword tripped up claude and made it think it's a negative property that has to always stay /sigh</span></div></div></li></ul><div><ul><li>Sync: <span>Probably, it lets me select it but doesn't give me the option to strip it off</span></li></ul></div>
