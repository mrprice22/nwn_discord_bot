- id: potions-to-restore-spent-spells-and-feats-day
  notes: <div><div><span><span>HomelessSon</span><span><span> [MW], </span></span></span><span><span><i> — </i>9:42 AM</span></span><div><span>I think it would be cool to have potions that give you some (spent) spell slots back.. just not sure how to price them or where they should be looted </span><span><img src="https://discord.com/assets/0424e06a82d250e2.svg" alt="🙂"></span> <span><span></span></span></div></div><div><div></div></div></div><div><div><span><span><br></span></span></div><div><span><span>Sync </span></span><span><span><i>— </i>9:45 AM</span></span><div><span>Ah yeah, on a diablo server I played they had mana pots</span></div></div><div><div></div></div></div><div><div> <div><span>Small, medium and large</span></div></div><div><div><div></div><div></div><span><div></div></span></div></div><div><div></div></div></div><div><div> <div><span>Each refilling a portion of the daily  spells</span></div></div><div><div></div></div></div><div><div> <div><span>And the large one also refilling feat like stuff</span></div></div><div><div></div></div></div><div><div> <div><span>Like hellballs and such</span></div></div><div><div></div></div></div><div><div> <div><span>Which having that also for shape uses would be nice.... Since you have to keep going out of it sometimes </span><span><img src="https://discord.com/assets/5134d215343b97ef.svg" alt="😅"></span> <span><span></span></span></div></div><div><div></div></div></div><div><div> <div><span>They had it tied to progression (acts) the best ones being on the last town</span></div></div><div><div><div></div><div></div><span><div></div></span></div></div><div><div></div></div></div><div><div><span><span><br></span></span></div><div><span><span>HomelessSon</span><span><span> [MW], </span></span></span><span><span><i> — </i>9:51 AM</span></span><div><span>yeah those large ass dragons lol.. I looked into resizing those once, I think it's possible.. we were having issues with some area transitions only working when you're not a giant dragon.  I could start with a small change like 80% of normal size I suppose </span><span><img src="https://discord.com/assets/0424e06a82d250e2.svg" alt="🙂"></span></div></div><div><div></div></div></div><div><div><span><span><br></span></span></div><div><span><span>Sync</span><span></span></span><span><span><i> — </i>9:52 AM</span></span><div><span>Yeah, i like being a big dragon.... But they can really be annoying in a party or small areas </span><span><img src="https://discord.com/assets/e5bddb2a9171637d.svg" alt="🤣"></span></div></div><div><div></div></div></div><div><div> <div><span>Think theres a cep dragon which is like human size (unless it was just a regular one resized)</span></div></div><div><div></div></div></div><div><div> <div><span>Other server where I also played a dragon build, they had an extra feat you needed to take for unlimited uses of dragon shape</span></div></div><div><div><div></div><div></div><span><div></div></span></div></div><div><div></div></div></div><div><div><span><span><br></span></span></div><div><span><span>HomelessSon</span><span><span> [MW], </span></span></span><span><span><i> — </i>9:54 AM</span></span><div><span>that sounds fun</span></div><div><span><br></span></div></div><div><div><span><span>Sync </span></span><span><span><i>— </i>9:54 AM</span></span><div><span>So you could just shift and unshift to go through tight areas and doors</span></div></div></div></div>
- id: item-morph-type
  notes: '<div><font color="#26a269">Admin note: This might not be needed or compatible with </font><a href="#idea-rng-based-gear-diablo-world-of-warcraft-style">RNG based GEAR (Diablo/World of Warcraft Style)</a></div><div><br></div><div>Sync 8/31/26:</div><div><div><div><span>Also for that I suppose theres also ways to limit it, like only melee weapon to melee weapon (excluding gloves), only allowing blank weapons as the copy target, etc.</span></div></div><div><div></div></div></div><div><div> <div><span>Or a forge npc somewhere else allowing up to +15 and the 3-4 damage lines up to 2d10 plus keen and such....</span></div></div><div><div></div></div></div><div><div> <div><span>Obviously i dont know if that''s easy to do or not.... Just listing several systems ive seen in other servers </span><span><img src="https://discord.com/assets/5134d215343b97ef.svg" alt="😅"></span></div></div></div>'
